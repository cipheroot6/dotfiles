# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bind = SUPER, X, exec, code
bind = SUPER, A, exec, antigravity
bind = SUPER, B, exec, firefox
bind = SUPER ALT, B, exec, firefox --private-window
bind = SUPER SHIFT, B, exec, brave
bind = SUPER, M, exec, LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=%U

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu


# my biddings

#wallpapers
bind = SUPER, Q, exec, ~/.scripts/wall-toggle.sh
bind = SUPER, E, exec, ~/.scripts/wall-next.sh

#MUSIC CONTROL KEYBINDS

# Next Track
bind = CTRL ALT, right, exec, $osdclient --playerctl next

# Previous Track
bind = CTRL ALT, left, exec, $osdclient --playerctl previous

# Volume Up
bind = CTRL ALT, up, exec, $osdclient --output-volume raise

# Volume Down
bind = CTRL ALT, down, exec, $osdclient --output-volume lower

# Mute Toggle
bind = CTRL ALT, M, exec, $osdclient --output-volume mute-toggle

# Play/Pause
bind = CTRL, SPACE, exec,  $osdclient --playerctl play-pause
bind = SUPER, Z, exec, $osdclient --playerctl play-pause


#windowrule {
#    name = spotify-on-0
#    workspace = 10
#    match:class = ^(spotify)$
#}

windowrule = match:class ^(Spotify)$, workspace 10 silent

# Display off
bind = SUPER SHIFT, L, exec,  sleep 1 && hyprctl dispatch dpms off 
# QuickShell
bind = SUPER ALT, Q, exec, quickshell -p ~/.config/quickshell

# Unbind default Super+Tab workspace switch
unbind = SUPER, TAB

# FocusTime (Screen Time Tracker)
bind = SUPER, T, exec, ~/.config/hypr/scripts/toggle-focus-time.sh

#exec-once = libinput-gestures-setup start


# screenshot

bind = , Print, exec, grimblast copy area && notify-send "copied to clipboard"          # select region → clipboard
bind = SUPER, Print, exec, grimblast save area && notify-send "saved in pictures"      # select region → save file
bind = SHIFT, Print, exec, grimblast copy screen && notify-send "copied to clipboard"    # full screen → clipboard

# Captures
unbind = , PRINT, Screenshot, exec, omarchy-cmd-screenshot
unbind = ALT, PRINT, Screenrecording, exec, omarchy-menu screenrecord
unbind = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# bar

bind = SUPER , R , exec,QML2_IMPORT_PATH=~/.config/quickshell/dynamic_island quickshell -p ~/.config/quickshell/dynamic_island/shell.qml &
bind = SUPER SHIFT, R, exec, pkill quickshell


bind = SUPER, TAB, exec, qs ipc -p ~/.config/quickshell/dynamic_island/shell.qml call overview toggle
