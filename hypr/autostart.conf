# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Set OMARCHY_PATH for Hyprland session
exec-once = export OMARCHY_PATH=$HOME/.local/share/omarchy && export PATH=$OMARCHY_PATH/bin:$PATH

# Load Xresources for cursor theme
exec-once = xrdb -merge ~/.Xresources

# Set cursor theme directly with Hyprland
exec-once = hyprctl setcursor catppuccin-mocha-mauve-cursors 24

#exec-once = rm /tmp/wob.sock 

# exec-once = omarchy-lock-screen

exec-once = /usr/bin/kdeconnectd
exec-once = sleep 3 && kdeconnect-indicator
exec-once = ydotoold

# exec-once = kwybars-daemon

# exec-once = ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py

exec-once = hyprpm load-all

exec-once = ~/.scripts/hot-corners.sh

exec-once = QML2_IMPORT_PATH=~/.config/quickshell/dynamic_island quickshell -p ~/.config/quickshell/dynamic_island/shell.qml
